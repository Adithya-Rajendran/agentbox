y="Excalifont, Xiaolai, Segoe UI Emoji" font-size="15px" fill="#1e1e1e" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">(retry every 20 s, up to an hour) - a model is never pulled out</text><text x="259.875" y="50.715" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="15px" fill="#1e1e1e" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">from under a running agent. Shows up as wait_seconds.</text></g><g transform="translate(154.24999999999994 424.75) rotate(0 365.75 17.5)"><text x="365.75000000000006" y="12.334" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="14px" fill="#757575" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Remote models (llm-bridge) use no GPU and never wait. Host memory guards (OOM killer, earlyoom)</text><text x="365.75000000000006" y="29.834" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="14px" fill="#757575" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">remain the backstop.</text></g></svg>